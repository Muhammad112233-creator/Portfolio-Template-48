<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc"><title id="title">Friday Society</title><desc id="desc">A night-time gradient title with softly animated stars and a gold glow.</desc><defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090706"/><stop offset=".52" stop-color="#211308"/><stop offset="1" stop-color="#090706"/></linearGradient><linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9b875"><animate attributeName="stop-color" values="#e9b875;#f3dfb3;#c98c66;#d4b6e8;#e9b875" dur="9s" repeatCount="indefinite"/></stop><stop offset=".48" stop-color="#f5e6c9"><animate attributeName="stop-color" values="#f5e6c9;#d6ae72;#e0b8a0;#e7d4fc;#f5e6c9" dur="9s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#c9905d"><animate attributeName="stop-color" values="#c9905d;#e9b875;#f3dfb3;#c98c66;#c9905d" dur="9s" repeatCount="indefinite"/></stop></linearGradient><radialGradient id="glow"><stop stop-color="#c28a40" stop-opacity=".28"/><stop offset="1" stop-color="#c28a40" stop-opacity="0"/></radialGradient><filter id="blur"><feGaussianBlur stdDeviation="20"/></filter></defs><rect width="1200" height="310" rx="18" fill="url(#wash)"/><ellipse cx="600" cy="145" rx="380" ry="115" fill="url(#glow)" filter="url(#blur)"/><g fill="#f2d7a7" opacity=".75"><circle cx="153" cy="72" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="3.2s" repeatCount="indefinite"/></circle><circle cx="1014" cy="65" r="1.7"><animate attributeName="opacity" values="1;.2;1" dur="4s" repeatCount="indefinite"/></circle><circle cx="934" cy="224" r="1.2"><animate attributeName="opacity" values=".2;.9;.2" dur="3.7s" repeatCount="indefinite"/></circle><circle cx="285" cy="245" r="1.4"><animate attributeName="opacity" values=".3;1;.3" dur="4.5s" repeatCount="indefinite"/></circle></g><text x="600" y="139" text-anchor="middle" fill="url(#rainbow)" font-family="Georgia,serif" font-size="65" letter-spacing="12">FRIDAY SOCIETY</text><text x="600" y="183" text-anchor="middle" fill="#d9c7a8" opacity=".8" font-family="Arial,sans-serif" font-size="13" letter-spacing="5">KEEP THE NIGHT CLOSE</text><line x1="430" y1="214" x2="770" y2="214" stroke="#d3aa6a" stroke-opacity=".36"/><text x="600" y="250" text-anchor="middle" fill="#ad9878" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">A RESPONSIVE EVENT PORTFOLIO · VITE · THREE.JS · GSAP</text><circle cx="600" cy="212" r="3" fill="#f1d9a7"><animate attributeName="r" values="2;4;2" dur="2.5s" repeatCount="indefinite"/></circle></svg>
